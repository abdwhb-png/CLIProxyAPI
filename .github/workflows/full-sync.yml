name: Sync Complet (Branche + Tags)

on:
  workflow_dispatch: # Active un bouton manuel dans l'interface GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permet de pousser les modifications sur votre fork
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère tout l'historique

      - name: Configurer Git, Synchroniser la Branche et les Tags
        run: |
          # 1. Configurer l'identité Git requise pour le merge
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # 2. Ajouter le dépôt d'origine (remplacez par les bonnes infos)
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI
          
          # 3. Récupérer les nouveautés (branches + tags)
          git fetch upstream --tags
          
          # 4. Fusionner la branche principale d'origine (ex: main ou master) dans votre branche actuelle
          # Remplacez 'main' si la branche par défaut du dépôt d'origine s'appelle autrement
          git merge upstream/main --ff-only || git merge upstream/main --no-edit
          
          # 5. Tout envoyer sur votre fork GitHub d'un seul coup
          git push origin HEAD --tags
