name: Sync Complet (Branche + Tags)

on:
  workflow_dispatch: # Active un bouton manuel dans l'interface GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permet de pousser les modifications sur votre fork
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère tout l'historique

      - name: Configurer Git, Synchroniser la Branche et les Tags
        run: |
          # 1. Configurer l'identité Git requise pour le merge
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # 2. Ajouter le dépôt d'origine (remplacez par les bonnes infos)
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI
          
          # 3. Télécharger explicitement la branche main ET les tags d'upstream
          git fetch upstream main --tags
          
          # 4. Fusionner la branche distante que Git connaît maintenant parfaitement
          git merge upstream/main --ff-only || git merge upstream/main --no-edit
          
          # 5. Pousser les commits mis à jour vers votre fork
          git push origin HEAD

      - name: Pousser uniquement les tags manquants
        run: |
          # Envoi des tags un par un pour éviter le plantage réseau (Timeout) de GitHub
          for tag in $(git tag); do
            if ! git ls-remote --tags origin | grep -q "refs/tags/$tag"; then
              echo "Poussée du tag manquant : $tag"
              git push origin refs/tags/$tag
            fi
          done
